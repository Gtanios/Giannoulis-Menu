  <style>
    :root{

    *{

      -webkit-tap-highlight-color:transparent;

      padding:0;

      overflow-x:hidden;

      min-height:100dvh;
    }

      margin:0 auto;
      padding:10px;

    .hero-card{
      border-radius:28px;
      border:1px solid var(--line);
      background:
        radial-gradient(circle at 84% 18%, rgba(200,116,53,.14), transparent 18%),
        linear-gradient(180deg, #111723 0%, #0d121a 100%);
      box-shadow:var(--shadow);
      padding:8px 10px 10px;
      overflow:visible;
      position:relative;
      width:100%;
      box-sizing:border-box;
    }

    /* ensure hero-card children sit above bg image */
    .hero-card > *:not(.hero-card-bg){
      position:relative;
      z-index:1;
    }

    /* ── TOPBAR: z-index ώστε να είναι πάντα πάνω από το logo ── */
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:relative;
      z-index:10;
      margin-bottom:0;
    }

    .social-links{
      display:inline-flex;
      gap:6px;
      flex-shrink:0;
    }

    .social-btn{
      display:flex;
      align-items:center;
      justify-content:center;
      width:44px;
      height:44px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      color:var(--text);
      text-decoration:none;
      transition:background .18s ease, border-color .18s ease;
      touch-action:manipulation;
    }

    .social-btn:hover{
      background:rgba(255,255,255,.09);
      border-color:rgba(255,255,255,.18);
    }

    .social-btn svg{
      width:18px;
      height:18px;
      flex-shrink:0;
    }

    .lang-switch{
      display:inline-flex;
      gap:4px;
      padding:4px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
    }

    .lang-btn{
      border:none;
      background:transparent;
      width:44px;
      height:44px;
      border-radius:999px;
      padding:0;
      cursor:pointer;
      appearance:none;
      -webkit-appearance:none;
      position:relative;
      z-index:10;
      touch-action:manipulation;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:box-shadow .18s ease, transform .15s ease;
    }

    .lang-btn svg{
      width:32px;
      height:32px;
      border-radius:50%;
      display:block;
      overflow:hidden;
      opacity:.45;
      transition:opacity .18s ease;
    }

    .lang-btn.active svg{
      opacity:1;
    }

    .lang-btn.active{
      box-shadow:0 0 0 2.5px rgba(255,255,255,.85), 0 4px 14px rgba(0,0,0,.4);
      transform:scale(1.1);
    }

    .brand{
      text-align:center;
      padding:0;
      pointer-events:none;
      /* το logo κεντράρεται πάνω στο card, μισοβγαίνει έξω */
      margin-top:-120px;
      margin-bottom:-100px;
    }

    .logo{
      width:100%;
      max-width:360px;
      margin:0 auto;
    }

    .logo img{
      display:block;
      width:100%;
      height:auto;
      pointer-events:none;
      filter:brightness(1.8);
    }

    /* ── ACTION BUTTONS - minimal/clean redesign ── */
    .actions-bar{
      display:flex;
      flex-direction:row;
      gap:10px;
      padding:4px 4px 10px;
      margin:0 0 4px;
    }

    .actions-bar::-webkit-scrollbar,
    .group-rail::-webkit-scrollbar{
      display:none;
    }

    .action-btn {
      flex: 1 1 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(0,0,0,.45);
      color: var(--text);
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      text-align: left;
      transition: background .18s ease, border-color .18s ease;
      touch-action: manipulation;
    }

    .action-btn::before {
      display: none;
    }

    .action-btn .btn-icon {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      opacity: .9;
    }

    .action-btn .btn-icon svg {
      width: 30px;
      height: 30px;
    }

    .action-btn .btn-text {
      flex: 1;
      min-width: 0;
    }

    .action-btn .btn-title {
      display: block;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--text);
    }

    .action-btn .btn-sub {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: var(--accent);
      margin-top: 3px;
      letter-spacing: .02em;
    }

    .action-btn .btn-arrow {
      flex-shrink: 0;
      color: rgba(255,255,255,.5);
      font-size: 20px;
      line-height: 1;
    }

    .action-btn:hover {
      background: rgba(0,0,0,.6);
      border-color: rgba(255,255,255,.25);
    }

    .action-btn:active {
      background: rgba(0,0,0,.7);
    }
    /* ────────────────────────────────────────────── */

    .group-rail{
      display:flex;
      gap:8px;
      overflow-x:auto;
      padding:4px 2px 8px;
      margin:0;
      scrollbar-width:none;
      -webkit-overflow-scrolling:touch;
      width:100%;
      box-sizing:border-box;
    }

    .group-chip{
      flex:0 0 auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      min-width:80px;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.45);
      color:var(--text);
      white-space:nowrap;
      cursor:pointer;
      appearance:none;
      -webkit-appearance:none;
      transition:.18s ease;
      touch-action:manipulation;
      text-align:center;
    }

    .group-chip .chip-icon{
      width:26px;
      height:26px;
      display:flex;
      align-items:center;
      justify-content:center;
      opacity:.9;
    }

    .group-chip .chip-icon svg{
      width:22px;
      height:22px;
    }

    .group-chip .chip-title{
      display:block;
      font-size:11px;
      font-weight:700;
      letter-spacing:.06em;
      text-transform:uppercase;
      color:var(--text);
      line-height:1.1;
    }

    .group-chip .chip-sub{
      display:block;
      font-size:9.5px;
      font-weight:400;
      color:var(--muted);
      letter-spacing:.02em;
      line-height:1.1;
    }

    .group-chip:hover{
      background:rgba(0,0,0,.6);
      border-color:rgba(255,255,255,.22);
    }

    .group-chip.active{
      background:linear-gradient(160deg, #c87435, #a85d27);
      border-color:transparent;
      box-shadow:0 6px 18px rgba(200,116,53,.35);
    }

    .group-chip.active .chip-title{
      color:#fff;
    }

    .group-chip.active .chip-sub{
      color:rgba(255,255,255,.75);
    }

    .status-line{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:4px 2px 0;
      color:var(--muted);
      font-size:11px;
    }

    .content{
      position:relative;
      z-index:1;
    }

    .section-card{
      margin-top:14px;
      border-radius:22px;
      overflow:hidden;
      border:1px solid var(--line);
      background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.018));
      box-shadow:var(--shadow);
    }

    .section-head{
      padding:16px 16px 12px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .section-title{
      margin:0;
      font-size:20px;
      font-weight:800;
      letter-spacing:-.02em;
    }

    .section-subtitle{
      margin-top:6px;
      color:var(--muted);
      font-size:12px;
      line-height:1.45;
    }

    .table{
      padding:6px 16px 10px;
    }

    .table-head,
    .item{
      display:grid;
      grid-template-columns:minmax(0,1fr) 76px 76px;
      gap:12px;
      align-items:start;
    }

    .table-head.single,
    .item.single{
      grid-template-columns:minmax(0,1fr) 76px;
    }

    .table-head{
      padding:8px 0 6px;
      color:#c9a84c;
      font-size:11px;
      font-weight:800;
      letter-spacing:.06em;
      text-transform:uppercase;
    }

    .item{
      padding:13px 0;
      border-top:1px solid rgba(255,255,255,.06);
    }

    .name-el{
      font-size:15px;
      font-weight:700;
      line-height:1.35;
      color:var(--text);
    }

    .name-en{
      margin-top:3px;
      font-size:12px;
      color:var(--muted);
      line-height:1.35;
    }

    .desc{
      margin-top:6px;
      font-size:11px;
      color:#8f98aa;
      line-height:1.45;
    }

    .price,
    .grande{
      text-align:right;
      white-space:nowrap;
      font-variant-numeric:tabular-nums;
      font-size:15px;
      font-weight:700;
    }

    .empty{
      color:#687285;
    }

    .footer{
      text-align:center;
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
      padding:14px 8px 6px;
    }

    .hidden{
      display:none !important;
    }

    /* Modal */
    .modal{
      position:fixed;
      inset:0;
      z-index:100;
      display:none;
      background:rgba(8,10,14,.72);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      padding:14px;
    }

    .modal.show{
      display:block;
    }

    .modal-sheet{
      width:100%;
      max-width:560px;
      margin:0 auto;
      border-radius:24px;
      border:1px solid var(--line);
      background:linear-gradient(180deg, #131924 0%, #0d121a 100%);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .modal-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:16px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .modal-title{
      font-size:18px;
      font-weight:800;
      color:#c9a84c;
    }

    .close-btn{
      border:none;
      background:rgba(255,255,255,.05);
      color:var(--text);
      min-width:40px;
      height:40px;
      border-radius:999px;
      font-size:18px;
      cursor:pointer;
      appearance:none;
      -webkit-appearance:none;
      touch-action:manipulation; /* ← ΝΕΟ */
    }

    .modal-body{
      padding:8px 16px 18px;
    }

    .rules-list{
      margin:0;
      padding-left:0;
      list-style:none;
      color:var(--text);
      font-size:14px;
      line-height:1.6;
      display:flex;
      flex-direction:column;
      gap:12px;
      counter-reset:rule-counter;
    }

    .rules-list li{
      display:flex;
      gap:12px;
      align-items:flex-start;
      counter-increment:rule-counter;
      color:var(--text);
    }

    .rules-footer{
      margin-top:16px;
      padding:12px 16px;
      border-radius:12px;
      border:1px solid rgba(201,168,76,.35);
      background:rgba(201,168,76,.07);
      color:#c9a84c;
      font-size:13px;
      font-weight:700;
      text-align:center;
    }

    .rules-list li::before{
      content:counter(rule-counter);
      flex-shrink:0;
      width:24px;
      height:24px;
      border-radius:50%;
      border:1.5px solid rgba(201,168,76,.5);
      background:rgba(201,168,76,.08);
      color:#c9a84c;
      font-size:11px;
      font-weight:800;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-top:1px;
    }
</style>

    }

    function updateLangButtons() {
      document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.lang === state.lang);
      });
    }

    function updateStaticTexts() {
      swipeHint.textContent = state.lang === "el"
        ? "Swipe δεξιά / αριστερά"
        : "Swipe left / right";

      footerNote.innerHTML = state.lang === "el"
        ? "Όλες οι τιμές περιλαμβάνουν Φ.Π.Α."
        : "All prices include VAT.";

      document.getElementById("btnPool").querySelector(".btn-title").textContent = state.lang === "el" ? "ΠΙΣΙΝΑ" : "POOL";
      document.getElementById("btnPool").querySelector(".btn-sub").textContent = state.lang === "el" ? "Κανόνες Πισίνας" : "Pool Rules";
      document.getElementById("btnHotel").querySelector(".btn-title").textContent = state.lang === "el" ? "ΞΕΝΟΔΟΧΕΙΟ" : "HOTEL";
      document.getElementById("btnHotel").querySelector(".btn-sub").textContent = state.lang === "el" ? "Πληροφορίες" : "Hotel Info";
    }

    function render() {
      updateLangButtons();
      updateStaticTexts();
      renderRail();
      renderMenuContent();
    }

    document.addEventListener("click", function (e) {
      const langBtn = e.target.closest(".lang-btn");
      if (langBtn) {
        state.lang = langBtn.dataset.lang;
        render();
        return;
      }

      const groupBtn = e.target.closest(".group-chip");
      if (groupBtn) {
        state.groupIndex = Number(groupBtn.dataset.index);
        render();
        return;
      }

      const actionBtn = e.target.closest(".action-btn");
      if (actionBtn) {
        openRules(actionBtn.dataset.rule);
        return;
      }

      if (e.target.id === "closeModal" || e.target === rulesModal) {
        closeRules();
      }
    });

    render();
  </script>
</body>
</html>
